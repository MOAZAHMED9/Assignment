
 <!doctype html> 
<html>

    <head>
        <title>Input</title>
        <meta charset="UTF-8">
        <meta 
        name = descreptio                           
        content = "this is descrtepton bage">

    </head>

    <body>
        
        <table border="1">
            <tr> <th colspan="3"> Registration Form</th></tr>
           
            <tr>
                <td>First Name</td>
                <td><input type="text" name="firstName"></td>
            </tr>
        
            <tr>
                <td>Last Name</td>
                <td><input type="text" name="lastName"></td>
            </tr>
        
            <tr>
                <td>User Name</td>
                <td><input type="text" name="userName"></td>
            </tr>
        
            <tr>
                <td>Password</td>
                <td><input type="password" name="password"></td>
            </tr>
        
            
        
            <tr>
                <td>Gender</td>
                <td>
                    <input type="radio" name="gender" value="Male"> Male<br>
                    <input type="radio" name="gender" value="Female"> Female
                </td>
            </tr>
        
            <tr>
                <td>Favorites</td>
                <td>
                    <input type="checkbox" name="favorites" value="Football"> Football
                    <input type="checkbox" name="favorites" value="Basketball"> Basketball<br>
        
                    <input type="checkbox" name="favorites" value="Games"> Games
                    <input type="checkbox" name="favorites" value="Reading"> Reading<br>
        
                    <input type="checkbox" name="favorites" value="Swimming"> Swimming
                    <input type="checkbox" name="favorites" value="Travel"> Travel
                </td>
            </tr>
        
            <tr>
                <td>Description</td>
                <td><textarea name="description" rows="4" cols="30"></textarea></td>
            </tr>
        
            <tr>
                <td colspan="2" align="center">
                    <input type="submit" value="Submit">
                    <input type="reset" value="Reset">
                </td>
            </tr>
        </table>
       
    </body>


</html>
